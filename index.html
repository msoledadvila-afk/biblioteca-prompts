if(ex){setCU(ex);setScreen("app");return;}
if(users.length>=cfg.maxUsers){setError("Límite de "+cfg.maxUsers+" usuarios alcanzado.");return;}
setLoading(true);const nu={name:nm.trim(),email:em.trim().toLowerCase(),joinedAt:new Date().toISOString()};
try{await db.collection("empresas").doc(cc).collection("usuarios").add(nu);const u=await fbUsers(cc);setUsers(u);setCU(nu);setLoading(false);setScreen("app");}
catch{setError("Error al registrar.");setLoading(false);}};
return(<div style={S.loginWrap}><div style={S.loginCard}>
<div style={{textAlign:"center",marginBottom:32}}>
<div style={{fontSize:11,color:"#C8A951",fontWeight:600,letterSpacing:2}}>TALENTO IMPULSA</div>
<div style={{fontSize:22,fontWeight:700,color:"#4A3F35"}}>Prompt Studio PCA™</div>
<div style={{fontSize:15,fontWeight:600,color:"#C8A951",marginTop:8}}>{cfg.company}</div>
<div style={{marginTop:10}}><span style={S.tag("#5B8C5A")}>Método PCA™ · C.R.E.F.</span></div></div>
{!adm?(<div style={{display:"flex",flexDirection:"column",gap:16}}>
<div><label style={S.lb}>Tu nombre completo</label><input style={S.inp} value={nm} onChange={e=>setNm(e.target.value)} placeholder="Ej: María González"/></div>
<div><label style={S.lb}>Tu email corporativo</label><input style={S.inp} type="email" value={em} onChange={e=>setEm(e.target.value)} placeholder="Ej: maria@empresa.com"/></div>
{error&&<div style={S.err}>{error}</div>}
<button style={S.btnP} onClick={go} disabled={loading}>{loading?"Registrando...":"Ingresar"}</button>
<button style={S.btnS} onClick={()=>{setAdm(true);setError("");}}>Acceso administrador</button>
<div style={{fontSize:11,color:"#B0A898",textAlign:"center"}}>{users.length}/{cfg.maxUsers} usuarios</div>
<div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:11,color:"#C8A951",cursor:"pointer",textDecoration:"underline"}} onClick={()=>{setCC(null);setCfg(null);setUsers([]);setScreen("code");setCode("");setNm("");setEm("");setAdm(false);setAp("");}}>← Cambiar empresa</span></div>
</div>):(<div style={{display:"flex",flexDirection:"column",gap:16}}>
<div><label style={S.lb}>Contraseña administración</label><input style={S.inp} type="password" value={ap} onChange={e=>setAp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")go();}}/></div>
{error&&<div style={S.err}>{error}</div>}
<button style={S.btnP} onClick={go}>Ingresar como admin</button>
<button style={S.btnS} onClick={()=>{setAdm(false);setError("");}}>Volver</button>
<div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:11,color:"#C8A951",cursor:"pointer",textDecoration:"underline"}} onClick={()=>{setCC(null);setCfg(null);setUsers([]);setScreen("code");setCode("");setNm("");setEm("");setAdm(false);setAp("");}}>← Cambiar empresa</span></div>
</div>)}</div></div>);}

// ─── MAIN APP ───
const ck=Object.keys(CATEGORIES);const ac=aCat?CATEGORIES[aCat]:null;
const ap_=selP?CATEGORIES[selP.ck].prompts[selP.i]:null;
const tot=Object.values(CATEGORIES).reduce((s,c)=>s+c.prompts.length,0);
const logout=()=>{setCU(null);setACat(null);setSelP(null);setFV({});setGenP("");setSA(false);setScreen("login");setCode("");setNm("");setEm("");setAdm(false);setAp("");};
const fullLogout=()=>{setCU(null);setACat(null);setSelP(null);setFV({});setGenP("");setSA(false);setCC(null);setCfg(null);setUsers([]);setScreen("code");setCode("");setNm("");setEm("");setAdm(false);setAp("");};
const qS=ap_?calcQ(ap_.fields,fV):0;

return(<div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",background:"#F7F5F0",minHeight:"100vh",color:"#2C2C2C"}}>
{/* HEADER */}
<div style={{background:"linear-gradient(135deg,#4A3F35,#5C4F3E)",padding:"14px 20px",color:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
<div><div style={{fontSize:10,color:"#C8A951",fontWeight:600,letterSpacing:1.5,textTransform:"uppercase"}}>{cfg.company}</div><h1 style={{fontSize:17,fontWeight:700,margin:0}}>Prompt Studio PCA™</h1></div>
<div style={{display:"flex",alignItems:"center",gap:6}}>
<span style={{background:"rgba(200,169,81,0.15)",padding:"4px 10px",borderRadius:20,color:"#C8A951",fontSize:11}}>{cu?.isAdmin?"⚙ Admin":cu?.name}</span>
{cu?.isAdmin&&<button style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#ddd",padding:"4px 10px",borderRadius:8,cursor:"pointer",fontSize:11}} onClick={()=>setSA(!showAdm)}>{showAdm?"Prompts":"Admin"}</button>}
<button style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#ddd",padding:"4px 10px",borderRadius:8,cursor:"pointer",fontSize:11}} onClick={logout}>Salir</button>
<button style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#ddd",padding:"4px 10px",borderRadius:8,cursor:"pointer",fontSize:11,opacity:.6}} onClick={fullLogout} title="Cambiar empresa">✕</button>
</div></div>

{/* ADMIN */}
{showAdm&&cu?.isAdmin&&(<div style={{maxWidth:1100,margin:"0 auto",padding:16}}><div style={{background:"#FFF9EB",borderRadius:12,padding:20,border:"1px solid #F0E0B0"}}>
<div style={{fontSize:13,fontWeight:700,color:"#8B6914",marginBottom:14}}>⚙ Administración — {cfg.company}</div>
<div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
{[[users.length,"Usuarios"],[cfg.maxUsers,"Máximo"],[cfg.maxUsers-users.length,"Cupos"],[tot,"Prompts"]].map(([n,l],i)=>(<div key={i} style={{background:"#fff",padding:"8px 14px",borderRadius:10,border:"1px solid #F0E0B0",flex:1,minWidth:80}}><div style={{fontSize:20,fontWeight:700,color:"#C8A951"}}>{n}</div><div style={{fontSize:10,color:"#8B7D6B"}}>{l}</div></div>))}
</div>
<div style={{marginTop:16}}><div style={{fontSize:12,fontWeight:700,color:"#6B5E4F"}}>Usuarios registrados</div>
<div style={{marginTop:6,maxHeight:200,overflowY:"auto"}}>
{users.length===0&&<div style={{fontSize:12,color:"#B0A898",padding:6}}>Sin usuarios</div>}
{users.map((u,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"#fff",borderRadius:7,marginBottom:3,border:"1px solid #F0E0B0",fontSize:12}}><div><b>{u.name}</b> <span style={{color:"#8B7D6B",marginLeft:4}}>{u.email}</span></div><button style={{background:"#D4694A",color:"#fff",border:"none",borderRadius:5,padding:"3px 8px",fontSize:10,cursor:"pointer",fontWeight:600}} onClick={async()=>{if(u.id){await db.collection("empresas").doc(cc).collection("usuarios").doc(u.id).delete();setUsers(await fbUsers(cc));}}}>Eliminar</button></div>))}
</div></div></div></div>)}

{!showAdm&&(<React.Fragment>
{/* CATEGORY BAR */}
<div style={{display:"flex",gap:5,padding:"10px 14px",overflowX:"auto",background:"#fff",borderBottom:"1px solid #EDE8E0",flexWrap:"wrap"}}>
{ck.map(k=>(<button key={k} style={{padding:"7px 14px",borderRadius:10,border:aCat===k?"none":"1.5px solid #E0D8CC",background:aCat===k?CATEGORIES[k].color:"transparent",color:aCat===k?"#fff":"#6B5E4F",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4}} onClick={()=>{setACat(k);setSelP(null);setGenP("");setFV({});}}><span>{CATEGORIES[k].icon}</span>{CATEGORIES[k].label}</button>))}
</div>

<div style={{maxWidth:1100,margin:"0 auto",padding:16}}>
{/* WELCOME */}
{!aCat&&(<div style={{textAlign:"center",padding:"40px 16px"}}>
<div style={{fontSize:32,marginBottom:10}}>✦</div>
<h2 style={{fontSize:19,fontWeight:700,color:"#4A3F35",margin:0}}>Bienvenido al Prompt Studio PCA™</h2>
<p style={{color:"#8B7D6B",fontSize:13,marginTop:6,maxWidth:460,margin:"6px auto 0"}}>{tot} prompts profesionales con inteligencia C.R.E.F. integrada</p>
<div style={{display:"flex",justifyContent:"center",gap:6,marginTop:16,flexWrap:"wrap"}}>
{["C · Contexto","R · Rol","E · Especificación","F · Formato"].map((t,i)=>(<span key={i} style={S.tag(["#C8A951","#4A90D9","#5B8C5A","#D4694A"][i])}>{t}</span>))}
</div></div>)}

{/* PROMPT GRID */}
{aCat&&ac&&(<React.Fragment>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontSize:24}}>{ac.icon}</span><div><div style={{fontSize:13,fontWeight:700,color:"#6B5E4F"}}>{ac.label}</div><div style={{fontSize:11,color:"#B0A898"}}>{ac.prompts.length} prompts con inteligencia C.R.E.F.</div></div></div>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10,marginTop:10}}>
{ac.prompts.map((p,i)=>(<div key={i} style={{background:"#fff",borderRadius:10,padding:14,cursor:"pointer",border:selP?.ck===aCat&&selP?.i===i?"2px solid #C8A951":"1.5px solid #EDE8E0",boxShadow:selP?.ck===aCat&&selP?.i===i?"0 3px 12px rgba(200,169,81,0.12)":"none",transition:"all .15s"}} onClick={()=>{setSelP({ck:aCat,i});setFV({});setGenP("");setCopied(false);}}>
<div style={{display:"inline-block",background:"#F7F5F0",padding:"1px 6px",borderRadius:5,fontSize:10,fontWeight:700,color:"#B8963E",marginBottom:5}}>#{i+1}</div>
<div style={{fontSize:13,fontWeight:700,margin:0}}>{p.title}</div>
<div style={{fontSize:11,color:"#8B7D6B",marginTop:3}}>{p.desc}</div>
</div>))}</div></React.Fragment>)}

{/* PROMPT BUILDER */}
{ap_&&(<div style={{background:"#fff",borderRadius:12,padding:24,marginTop:16,border:"1.5px solid #EDE8E0"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}><div><div style={{fontSize:17,fontWeight:700}}>{ap_.title}</div><div style={{fontSize:12,color:"#8B7D6B",marginTop:3}}>{ap_.desc}</div></div><span style={S.tag(CATEGORIES[selP.ck].color)}>C.R.E.F. Inteligente</span></div>

{/* QUALITY BAR */}
<div style={{marginTop:16}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,fontWeight:600,color:qColor(qS)}}>{qLabel(qS)}</span><span style={{fontSize:11,fontWeight:700,color:qColor(qS)}}>{qS}%</span></div>
<div className="qbar"><div className="qfill" style={{width:qS+"%",background:qColor(qS)}}/></div></div>

{/* FIELDS */}
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:16}}>
{ap_.fields.map((f,i)=>(<div key={i} style={f.type==="textarea"?{gridColumn:"1 / -1"}:{}}><label style={S.lb}>{f.label}</label>
{f.type==="textarea"?<textarea style={{...S.inp,resize:"vertical",minHeight:70}} placeholder={f.placeholder} value={fV[f.id]||""} onChange={e=>setFV({...fV,[f.id]:e.target.value})}/>
:<input style={S.inp} placeholder={f.placeholder} value={fV[f.id]||""} onChange={e=>setFV({...fV,[f.id]:e.target.value})}/>}
</div>))}</div>

<div style={{display:"flex",gap:8,marginTop:16}}>
<button style={{...S.btnP,width:"auto",padding:"10px 24px"}} onClick={()=>{const p=CATEGORIES[selP.ck].prompts[selP.i];const v={};p.fields.forEach(f=>{v[f.id]=fV[f.id]||"["+f.label+"]";});setGenP(p.template(v));}}>✦ Generar Prompt Inteligente</button>
<button style={{...S.btnS,width:"auto",padding:"8px 18px",marginTop:0}} onClick={()=>{setFV({});setGenP("");}}>↺ Reiniciar</button></div>

{/* OUTPUT */}
{genP&&(<React.Fragment>
<div style={{marginTop:16,background:"#FAFAF8",borderRadius:10,border:"1.5px solid #E0D8CC",overflow:"hidden"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",background:"#F0EDE5",borderBottom:"1px solid #E0D8CC"}}>
<span style={{fontSize:11,fontWeight:600,color:"#6B5E4F"}}>Prompt C.R.E.F. generado con inteligencia PCA™</span>
<button style={{padding:"5px 14px",background:"#C8A951",color:"#fff",border:"none",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer"}} onClick={()=>copy(genP,setCopied)}>{copied?"✓ Copiado":"Copiar"}</button></div>
<div style={{padding:14,fontSize:13,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{genP}</div></div>

{ap_.whyWorks&&(<div className="why-box">
<div className="why-title">💡 Por qué funciona este prompt — Lógica C.R.E.F. aplicada</div>
{ap_.whyWorks.map((w,i)=>(<div key={i} className="why-item">{w}</div>))}
</div>)}
</React.Fragment>)}
</div>)}

{/* CONSTRUCTOR LIBRE */}
{aCat&&(<div style={{background:"#fff",borderRadius:12,padding:24,marginTop:24,border:"1.5px dashed #C8A951"}}>
<div style={{fontSize:15,fontWeight:700}}>✦ Constructor Libre C.R.E.F.</div>
<p style={{fontSize:11,color:"#8B7D6B",marginTop:3}}>Construí cualquier prompt desde cero con inteligencia PCA™</p>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:14}}>
{[{k:"C",l:"Contexto",c:"#C8A951",p:"Ej: Soy gerente de ventas..."},{k:"R",l:"Rol",c:"#4A90D9",p:"Ej: Actuá como consultor..."},{k:"E",l:"Especificación",c:"#5B8C5A",p:"Ej: Redactá una propuesta..."},{k:"F",l:"Formato",c:"#D4694A",p:"Ej: Documento con encabezado..."}].map(t=>(<div key={t.k}>
<label style={S.lb}><span style={{display:"inline-block",width:24,height:24,borderRadius:6,background:t.c,color:"#fff",textAlign:"center",lineHeight:"24px",fontSize:11,fontWeight:700,marginRight:5}}>{t.k}</span>{t.l}</label>
<textarea style={{...S.inp,resize:"vertical",minHeight:70}} rows={3} placeholder={t.p} value={libre[t.k]} onChange={e=>setLibre({...libre,[t.k]:e.target.value})}/>
</div>))}</div>
<div style={{display:"flex",gap:8,marginTop:14}}>
<button style={{...S.btnP,width:"auto",padding:"10px 24px"}} onClick={()=>setLO(buildPrompt(libre.R||"[Definí el rol]",libre.C||"[Definí el contexto]",libre.E||"[Definí la tarea]",libre.F||"[Definí el formato]"))}>✦ Generar C.R.E.F. Inteligente</button>
<button style={{...S.btnS,width:"auto",padding:"8px 18px",marginTop:0}} onClick={()=>{setLibre({C:"",R:"",E:"",F:""});setLO("");}}>↺ Reiniciar</button></div>
{libreOut&&(<div style={{marginTop:14,background:"#FAFAF8",borderRadius:10,border:"1.5px solid #E0D8CC",overflow:"hidden"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",background:"#F0EDE5",borderBottom:"1px solid #E0D8CC"}}>
<span style={{fontSize:11,fontWeight:600,color:"#6B5E4F"}}>Prompt C.R.E.F. Inteligente</span>
<button style={{padding:"5px 14px",background:"#C8A951",color:"#fff",border:"none",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer"}} onClick={()=>copy(libreOut,setLC)}>{libCop?"✓ Copiado":"Copiar"}</button></div>
<div style={{padding:14,fontSize:13,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{libreOut}</div></div>)}
</div>)}

{/* FOOTER */}
<div style={{textAlign:"center",padding:"24px 16px",color:"#8B7D6B",fontSize:11,borderTop:"1px solid #EDE8E0",marginTop:28}}>
<div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
{["C · Contexto","R · Rol","E · Especificación","F · Formato"].map((t,i)=>(<span key={i} style={S.tag(["#C8A951","#4A90D9","#5B8C5A","#D4694A"][i])}>{t}</span>))}
</div>
<p style={{margin:0}}>Prompt Studio PCA™ · <strong>Talento Impulsa Consulting</strong></p>
<p style={{margin:"3px 0 0",fontSize:10,opacity:.5}}>{tot} prompts con inteligencia C.R.E.F. · {ck.length} categorías · Constructor libre</p>
</div>
</div>
</React.Fragment>)}
</div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
